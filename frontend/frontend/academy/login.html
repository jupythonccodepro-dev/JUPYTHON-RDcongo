<!doctype html>
<html lang="fr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Se Connecter - Jupython</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/assets/css/brand.css?v=sitewide-experience-3">
  <style>
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow-x: hidden;
      overflow-y: auto;
    }

    main {
      flex: 1 0 auto;
    }
  </style>
</head>

<body class="bg-gray-950 text-white font-sans">

  <header class="jp-site-header">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <a href="../index.html" class="flex items-center gap-2 group">
        <img src="/images/logo%20jupython.png" alt="Logo Jupython" class="w-10 h-10 rounded object-contain">
        <span class="text-white font-extrabold text-xl group-hover:text-orange-300 transition">Jupython</span>
      </a>
      <a href="../index.html" class="text-sm text-gray-500 hover:text-orange-500 transition font-semibold">← Retour à
        l'accueil</a>
    </div>
  </header>

  <main class="relative flex items-center justify-center py-20 px-4">
    <div class="absolute inset-0 z-0 pointer-events-none" aria-hidden="true">
      <div class="w-full h-full bg-gray-950/70" style="background-image:linear-gradient(110deg,rgba(7,10,15,.88),rgba(7,10,15,.46)),url('/images/learning-lab.webp');background-size:cover;background-position:center"></div>
      <div class="absolute inset-0 bg-teal-950/20 backdrop-blur-[1px]"></div>
    </div>

    <div class="relative z-10 w-full max-w-[480px] bg-white rounded-[2.5rem] shadow-2xl p-10 md:p-14 text-center">
      <div class="inline-flex items-center justify-center bg-black w-16 h-16 rounded-2xl mb-6 shadow-xl">
        <img src="/images/logo%20jupython.png" alt="Logo Jupython" class="w-16 h-16 rounded-xl object-contain">
      </div>

      <p class="text-orange-500 font-semibold uppercase tracking-[0.3em] text-xs mb-3">Espace Academy</p>
      <h1 class="text-4xl font-black text-gray-900 mb-2 tracking-tight">Se connecter</h1>
      <p class="text-gray-500 font-medium mb-8">Accédez à votre compte Jupython et poursuivez votre parcours.</p>

      <div class="mb-8">
        <div id="googleLoginBtn" class="flex justify-center">
          <button type="button" disabled class="w-full flex items-center justify-center gap-3 border border-gray-200 py-3.5 rounded-2xl text-gray-700 font-bold shadow-sm disabled:cursor-not-allowed disabled:opacity-70">
            <img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" alt="" class="w-5 h-5">
            Continuer avec Google
          </button>
        </div>
        <p data-google-status role="status" class="text-xs text-gray-500 mt-2"></p>
      </div>

      <div class="relative flex items-center mb-8">
        <div class="flex-grow border-t border-gray-100"></div>
        <span class="px-4 text-gray-400 text-xs font-bold uppercase tracking-widest">Ou avec votre email</span>
        <div class="flex-grow border-t border-gray-100"></div>
      </div>

      <form id="loginForm" class="text-left space-y-5">
        <div>
          <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-2 ml-1">Messagerie électronique</label>
          <div class="relative">
            <input type="email" name="email" placeholder="votre.email@exemple.cd" required class="w-full bg-gray-50 border border-gray-100 py-4 px-4 rounded-2xl text-gray-900 focus:ring-2 focus:ring-orange-500/20 focus:border-orange-500 outline-none transition-all">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-2 ml-1">Mot de passe</label>
          <div class="relative">
            <input type="password" name="password" placeholder="••••••••" required class="w-full bg-gray-50 border border-gray-100 py-4 px-4 rounded-2xl text-gray-900 focus:ring-2 focus:ring-orange-500/20 focus:border-orange-500 outline-none transition-all">
          </div>
        </div>

        <button type="submit" class="w-full bg-orange-500 text-white font-black py-4 rounded-2xl shadow-xl shadow-orange-500/40 hover:bg-orange-600 hover:-translate-y-1 transition-all">
          Connexion
        </button>
      </form>

      <p class="mt-4 text-sm text-gray-500">
        <a href="forgot-password.html" class="text-orange-500 font-semibold hover:underline">Mot de passe oublié ?</a>
      </p>

      <p class="mt-8 text-gray-500 font-medium">
        Pas encore de compte ? <a href="register.html" class="text-orange-500 font-bold hover:underline">Créer un compte</a>
      </p>
    </div>
  </main>

  <footer class="bg-black pt-10 pb-6 px-6 border-t border-gray-900">
    <div class="text-center text-gray-600 text-xs">
      © Jupython 2025. Tous droits réservés.
    </div>
  </footer>

  <script>
    window.JUPYTHON_GOOGLE_CLIENT_ID = "{{ GOOGLE_CLIENT_ID|default:'' }}";
  </script>
  <script src="../assets/js/api.js?v=session-persistence-1"></script>
  <script src="../assets/js/auth-ui.js?v=account-menu-3"></script>
  <script src="../assets/js/google-auth.js?v=google-origin-hint-2"></script>
  <script src="../assets/js/login.js"></script>
</body>

</html>
