<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Créer un compte - Jupython</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/assets/css/brand.css?v=sitewide-experience-3">
  <style>
    body { display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden; overflow-y: auto; }
    main { flex: 1 0 auto; }
  </style>
</head>
<body class="bg-gray-950 text-white font-sans">

  <header class="jp-site-header">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <a href="../index.html" class="flex items-center gap-2 group">
        <img src="/images/logo%20jupython.png" alt="Logo Jupython" class="w-10 h-10 rounded object-contain">
        <span class="text-white font-extrabold text-xl group-hover:text-orange-300 transition">Jupython</span>
      </a>
      <a href="../index.html" class="text-sm text-gray-500 hover:text-orange-500 transition font-semibold">← Retour à l'accueil</a>
    </div>
  </header>

  <main class="relative flex items-center justify-center py-20 px-4">
    <div class="absolute inset-0 z-0 pointer-events-none" aria-hidden="true">
      <div class="w-full h-full bg-gray-950/70" style="background-image:linear-gradient(110deg,rgba(7,10,15,.88),rgba(7,10,15,.46)),url('/images/digital-network.webp');background-size:cover;background-position:center"></div>
      <div class="absolute inset-0 bg-gray-900/40 backdrop-blur-[2px]"></div>
    </div>

    <div class="relative z-10 w-full max-w-[550px] bg-white rounded-[2.5rem] shadow-2xl p-8 md:p-12 text-center">
      <div class="inline-flex items-center justify-center bg-black w-14 h-14 rounded-2xl mb-6 shadow-xl">
        <img src="/images/logo%20jupython.png" alt="Logo Jupython" class="w-14 h-14 rounded-xl object-contain">
      </div>

      <p class="text-orange-500 font-semibold uppercase tracking-[0.3em] text-xs mb-3">Créer votre compte</p>
      <h1 class="text-4xl font-black text-gray-900 mb-2">Rejoignez Jupython</h1>
      <p class="text-gray-500 font-medium mb-8">Créez votre profil et débutez votre parcours tech.</p>

      <div class="mb-6">
        <div id="googleRegisterBtn" class="flex justify-center">
          <button type="button" disabled class="w-full flex items-center justify-center gap-3 border border-gray-200 py-3 rounded-2xl text-gray-700 font-bold disabled:cursor-not-allowed disabled:opacity-70">
            <img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" alt="" class="w-5 h-5">
            Continuer avec Google
          </button>
        </div>
        <p data-google-status role="status" class="text-xs text-gray-500 mt-2"></p>
      </div>

      <div class="relative flex items-center mb-8">
        <div class="flex-grow border-t border-gray-100"></div>
        <span class="px-4 text-gray-400 text-[10px] font-bold uppercase tracking-[0.2em]">Ou avec votre email</span>
        <div class="flex-grow border-t border-gray-100"></div>
      </div>

      <form id="registerForm" class="text-left space-y-4">
        <div>
          <label class="block text-[11px] font-bold text-gray-700 uppercase mb-1.5 ml-1">Nom complet *</label>
          <div class="relative">
            <input type="text" name="fullname" placeholder="Jean Dupont" required class="w-full bg-gray-50 border border-gray-100 py-3.5 px-4 rounded-xl text-gray-900 focus:ring-2 focus:ring-orange-500/20 focus:border-orange-500 outline-none transition-all text-sm">
          </div>
        </div>

        <div>
          <label class="block text-[11px] font-bold text-gray-700 uppercase mb-1.5 ml-1">Messagerie électronique *</label>
          <div class="relative">
            <input type="email" name="email" placeholder="votre.email@exemple.cd" required class="w-full bg-gray-50 border border-gray-100 py-3.5 px-4 rounded-xl text-gray-900 focus:ring-2 focus:ring-orange-500/20 focus:border-orange-500 outline-none transition-all text-sm">
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-[11px] font-bold text-gray-700 uppercase mb-1.5 ml-1">Université / École *</label>
            <div class="relative">
              <input type="text" name="university" placeholder="Ex : UPN Kinshasa" required class="w-full bg-gray-50 border border-gray-100 py-3.5 px-4 rounded-xl text-gray-900 focus:ring-2 focus:ring-orange-500/20 focus:border-orange-500 outline-none transition-all text-sm">
            </div>
          </div>
          <div>
            <label class="block text-[11px] font-bold text-gray-700 uppercase mb-1.5 ml-1">Promotion (optionnel)</label>
            <div class="relative">
              <input type="text" name="promotion" placeholder="Ex : 2024" class="w-full bg-gray-50 border border-gray-100 py-3.5 px-4 rounded-xl text-gray-900 focus:ring-2 focus:ring-orange-500/20 focus:border-orange-500 outline-none transition-all text-sm">
            </div>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-[11px] font-bold text-gray-700 uppercase mb-1.5 ml-1">Mot de passe *</label>
            <div class="relative">
              <input type="password" name="password" placeholder="••••••••" required class="w-full bg-gray-50 border border-gray-100 py-3.5 px-4 rounded-xl text-gray-900 focus:ring-2 focus:ring-orange-500/20 focus:border-orange-500 outline-none transition-all text-sm">
            </div>
          </div>
          <div>
            <label class="block text-[11px] font-bold text-gray-700 uppercase mb-1.5 ml-1">Confirmer le mot de passe *</label>
            <div class="relative">
              <input type="password" name="confirm_password" placeholder="••••••••" required class="w-full bg-gray-50 border border-gray-100 py-3.5 px-4 rounded-xl text-gray-900 focus:ring-2 focus:ring-orange-500/20 focus:border-orange-500 outline-none transition-all text-sm">
            </div>
          </div>
        </div>

        <button type="submit" class="w-full bg-orange-500 text-white font-black py-4 rounded-2xl shadow-xl shadow-orange-500/30 hover:bg-orange-600 transition-all mt-4">
          S'inscrire
        </button>
      </form>

      <p class="mt-8 text-gray-500 font-medium text-sm">
        Déjà un compte ? <a href="login.html" class="text-orange-500 font-bold hover:underline">Se connecter</a>
      </p>
    </div>
  </main>

  <footer class="bg-black pt-10 pb-6 px-6 border-t border-gray-900">
    <div class="text-center text-gray-600 text-xs">
      © Jupython 2025. Tous droits réservés.
    </div>
  </footer>

  <script>
    window.JUPYTHON_GOOGLE_CLIENT_ID = "{{ GOOGLE_CLIENT_ID|default:'' }}";
  </script>
  <script src="../assets/js/api.js?v=session-persistence-1"></script>
  <script src="../assets/js/auth-ui.js?v=account-menu-3"></script>
  <script src="../assets/js/google-auth.js?v=google-origin-hint-2"></script>
  <script src="../assets/js/register.js"></script>
</body>
</html>
