<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Récupérez l?accès à votre compte Jupython Academy.">
  <title>Mot de passe oublié - Jupython Academy</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/assets/css/brand.css?v=sitewide-experience-3">
</head>
<body class="bg-gray-950 text-white min-h-screen flex flex-col">
  <header class="jp-site-header">
    <div class="max-w-7xl mx-auto flex items-center justify-between py-4 px-6">
      <a href="../index.html" class="flex items-center gap-2"><img src="/images/logo%20jupython.png" alt="Logo Jupython" class="w-10 h-10 object-contain"><span class="font-extrabold text-xl">Jupython</span></a>
      <a href="login.html" class="text-sm text-gray-400 hover:text-orange-300">Retour à la connexion</a>
    </div>
  </header>
  <main class="flex-1 flex items-center justify-center px-4 py-12">
    <section class="w-full max-w-lg rounded-3xl bg-white p-8 md:p-12 text-gray-900 shadow-2xl">
      <p class="text-orange-500 font-semibold uppercase tracking-[0.2em] text-xs mb-3">Espace Academy</p>
      <h1 class="text-3xl font-black mb-3">Mot de passe oublié ?</h1>
      <p class="text-gray-600 mb-6">Saisis l’adresse e-mail de ton compte. Si elle est enregistrée, tu recevras un lien pour choisir un nouveau mot de passe.</p>
      <form data-password-reset-request class="grid gap-4">
        <label class="grid gap-2 text-sm font-semibold text-gray-700">Adresse e-mail
          <input name="email" type="email" autocomplete="email" required class="rounded-xl border border-gray-200 bg-gray-50 px-4 py-3 text-gray-900">
        </label>
        <button type="submit" class="w-full rounded-xl bg-orange-500 px-5 py-3 font-bold text-white hover:bg-orange-600">Envoyer le lien</button>
        <p data-reset-feedback role="status" aria-live="polite" class="text-sm text-gray-600"></p>
      </form>
    </section>
  </main>
  <script src="../assets/js/api.js?v=password-recovery-2"></script>
  <script src="../assets/js/password-recovery.js?v=password-recovery-2"></script>
</body>
</html>
